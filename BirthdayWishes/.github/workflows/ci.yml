name: CI
on: [push, pull_request]
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install --upgrade pip
      - run: pip install -r BirthdayWishes/requirements.txt
      - run: cd BirthdayWishes && python manage.py check --deploy
      - run: cd BirthdayWishes && python manage.py test
